<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images/logo.png"
                 width="50"
                 height="50"
                 class="rounded-circle me-2"
                 alt="Logo">
            <span>Tiffany's Institute</span>
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="registration.html">Registration</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="profile.html">Profile</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- FORM -->

<div class="container my-5">

<h2 class="text-center text-primary mb-4">
Student Registration Form
</h2>

<form class="shadow p-4 bg-white rounded needs-validation"
      novalidate>

<div class="row">

<div class="col-12 col-md-6 mb-3">
<label class="form-label">Full Name</label>
<input type="text"
       class="form-control"
       required>

<div class="invalid-feedback">
Please enter full name.
</div>
</div>

<div class="col-12 col-md-6 mb-3">
<label class="form-label">Roll Number</label>
<input type="text"
       class="form-control"
       required>

<div class="invalid-feedback">
Please enter roll number.
</div>
</div>

<div class="col-12 col-md-6 mb-3">
<label class="form-label">Email</label>

<div class="input-group">

<span class="input-group-text">@</span>

<input type="email"
       class="form-control"
       required>

<div class="invalid-feedback">
Enter valid email.
</div>

</div>
</div>

<div class="col-12 col-md-6 mb-3">
<label class="form-label">Mobile Number</label>

<input type="tel"
       class="form-control"
       pattern="[0-9]{10}"
       required>

<div class="invalid-feedback">
Enter 10 digit mobile number.
</div>

</div>

<div class="col-12 col-md-6 mb-3">

<label class="form-label">
Gender
</label>

<select class="form-select" required>

<option value="">
Select Gender
</option>

<option>
Male
</option>

<option>
Female
</option>

<option>
Other
</option>

</select>

</div>

<div class="col-12 col-md-6 mb-3">

<label class="form-label">
Branch
</label>

<select class="form-select" required>

<option value="">
Select Branch
</option>

<option>
CSE
</option>

<option>
ECE
</option>

<option>
EEE
</option>

<option>
MECH
</option>

</select>

</div>

<div class="col-12 col-md-6 mb-3">

<label class="form-label">
Date of Birth
</label>

<input type="date"
       class="form-control"
       required>

</div>

<div class="col-12 col-md-6 mb-3">

<label class="form-label">
Upload Photo
</label>

<input type="file"
       class="form-control"
       required>

</div>

<div class="col-12 mb-3">

<label class="form-label">
Address
</label>

<textarea rows="4"
          class="form-control"
          required></textarea>

</div>

<div class="col-12 form-check mb-3">

<input class="form-check-input"
       type="checkbox"
       required>

<label class="form-check-label">

Accept Terms and Conditions

</label>

</div>

</div>

<button class="btn btn-primary">
Register Student
</button>

<button type="reset"
        class="btn btn-secondary">
Reset
</button>

</form>

</div>

<!-- FOOTER -->

<footer class="bg-dark text-white text-center p-3 mt-5">

<p class="mb-1">
© 2026 Tiffany's Institute Student Management Portal
</p>

<p class="mb-0">
Facebook | Instagram | LinkedIn
</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(() => {
  'use strict';

  const forms = document.querySelectorAll('.needs-validation');

  Array.from(forms).forEach(form => {

    form.addEventListener('submit', event => {

      if (!form.checkValidity()) {

        event.preventDefault();
        event.stopPropagation();

      }

      form.classList.add('was-validated');

    }, false);

  });

})();
</script>

</body>
</html>
